name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Third-party actions are pinned by commit SHA (release tag in the comment):
# a moved tag never changes the code this workflow runs.

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      BRAND_THEME: tartiflette
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Prepare database
        run: bin/rails db:test:prepare
      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build
      - name: Tests
        run: bin/rails test

  # The security and style gates of bin/ci (config/ci.rb).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: "Style: Ruby"
        run: bin/rubocop
      - name: "Security: gem audit (advisory database refreshed)"
        run: bin/bundler-audit check --update
      - name: "Security: npm vulnerability audit"
        run: npm audit
      - name: "Security: Brakeman code analysis"
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

  transcriber:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transcriber
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --prefer-binary -r requirements-dev.txt
      - name: Tests
        run: pytest -q

  # CycloneDX SBOM of the tree (gems, npm packages, Python requirements),
  # attached to each run on main as the `sbom.cdx.json` artifact.
  sbom:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          syft-version: v1.57.1
          artifact-name: sbom.cdx.json
          dependency-snapshot: false
          upload-release-assets: false
