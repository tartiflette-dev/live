# REUSE configuration (https://reuse.software/spec-3.3/): copyright and licence of every
# file of the tree. The default annotation below covers all files; the following ones
# cover third-party files (fonts, adapted code). A file header, where present
# (docs/legal/HEADERS.md), takes precedence over the default (precedence = "closest").
#
# Expression form: AGPL-3.0-only WITH LicenseRef-Live-AGPL-3.0-Terms
# The text of LicenseRef-Live-AGPL-3.0-Terms is LICENSES/LicenseRef-Live-AGPL-3.0-Terms.txt,
# a copy of ADDITIONAL_TERMS.md (keep the two identical).
version = 1
SPDX-PackageName = "Live"
SPDX-PackageSupplier = "Luc Létoffé"

# --- Default: the Program ---------------------------------------------------------------
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Luc Létoffé and the Live contributors"
SPDX-License-Identifier = "AGPL-3.0-only WITH LicenseRef-Live-AGPL-3.0-Terms"

# --- Fonts (SIL OFL 1.1) ---------------------------------------------------------------
[[annotations]]
path = ["public/fonts/Aspekta-*.woff2", "public/fonts/OFL-Aspekta.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2025 Ivo Dolenc (Reserved Font Name \"Aspekta\")"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["public/fonts/JetBrainsMono-*.woff2", "public/fonts/OFL-JetBrainsMono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["themes/tartiflette/assets/fonts/bricolage-grotesque-*.woff2", "themes/tartiflette/assets/fonts/OFL-bricolage-grotesque.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2022 The Bricolage Grotesque Project Authors (https://github.com/ateliertriay/bricolage)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["themes/tartiflette/assets/fonts/dm-sans-*.woff2", "themes/tartiflette/assets/fonts/OFL-dm-sans.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2014 The DM Sans Project Authors (https://github.com/googlefonts/dm-fonts)"
SPDX-License-Identifier = "OFL-1.1"

# --- Adapted third-party code (Apache-2.0) ----------------------------------------------
[[annotations]]
path = "app/javascript/rooms/room_tiles.jsx"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Luc Létoffé and the Live contributors", "Copyright 2023 LiveKit, Inc. (parts adapted from ParticipantTile 2.9)"]
SPDX-License-Identifier = "AGPL-3.0-only WITH LicenseRef-Live-AGPL-3.0-Terms AND Apache-2.0"

# --- Tooling template (contains the SPDX tag syntax as template text, not as a notice) -----
[[annotations]]
path = "docs/legal/reuse-template-live.jinja2"
precedence = "override"
SPDX-FileCopyrightText = "2026 Luc Létoffé and the Live contributors"
SPDX-License-Identifier = "AGPL-3.0-only WITH LicenseRef-Live-AGPL-3.0-Terms"
