# Tonalités des émissions (Voice ; docs/tonalites.md).
# `default` = la voix par défaut de l'application (vouvoiement, sobre) ; une émission
# n'écrit QUE les clés qu'elle change, le reste retombe sur `default`.
# Café IA : tutoiement, phrases courtes, chaleureux, concret.
# Corps des mails : gabarits app/views/registration_mailer/*+<émission>.erb.
fr:
  voices:
    default:
      date_format: "long"
      privacy_link: "politique de confidentialité"
      registration_mailer:
        confirmation:
          subject: "Confirmez votre inscription — %{title}"
        request_confirmation:
          subject: "Confirmez votre inscription"
        reminder:
          subject: "Rappel — %{title}, demain à %{time}"
          time_format: "%Hh%M"
        marketing_consent_confirmed:
          subject: "Merci — consentement enregistré"
        speaker_link:
          subject: "Est-ce bien vous ? — %{title}"
        access:
          subject: "Votre accès — %{title}"
      registrations:
        invalid_submission: "Renseignez votre nom et une adresse email valide."
        confirm:
          title: "Confirmer votre inscription"
          intro: "Si c'est bien vous, cliquez sur le bouton ci-dessous. Rien n'est confirmé tant que vous n'avez pas cliqué."
          button: "Confirmer mon inscription"
          not_you_html: "Si vous n'êtes pas à l'origine de cette inscription, fermez simplement cette page. Voir la %{privacy}."
          hand_over_intro: "Cette inscription a ouvert le direct depuis un autre navigateur. En confirmant ici, vous recevez votre propre accès sur ce navigateur, sous le prénom saisi ci-dessous ; ce qui a été dit depuis l'autre navigateur n'est pas rattaché à votre inscription. Pour garder vos échanges, confirmez depuis le navigateur où vous êtes entré·e."
        access:
          title: "Votre inscription est confirmée"
          intro: "Cliquez sur le bouton pour ouvrir la page du webinaire depuis ce navigateur."
          button: "Ouvrir la page du webinaire"
        already_registered:
          title: "Ce navigateur est déjà inscrit"
          intro: "Ce navigateur porte déjà une inscription à ce webinaire\u00a0: elle est conservée. Pour utiliser une autre inscription, ouvrez son lien depuis un autre navigateur."
          open: "Ouvrir la page du webinaire"
        # « Ce n'est pas moi » (NotMeController) : ce navigateur oublie son
        # inscription à ce webinaire, sans jamais lever un retrait.
        not_me:
          button: "Ce n'est pas moi"
          registered_hint: "Ordinateur partagé, ou une autre adresse\u00a0? Ce navigateur peut oublier cette inscription\u00a0:"
          # Page 409 : nomme l'inscription GARDÉE (celle du navigateur), jamais
          # celle du lien ouvert — « Ce n'est pas moi » ne peut pas être pris
          # pour l'inscription d'un tiers (docs/moderation.md).
          already_registered_hint: "Cette inscription est au nom de «\u00a0%{name}\u00a0». Ce n'est pas vous (ordinateur partagé)\u00a0? Ce navigateur peut l'oublier\u00a0:"
          room_hint: "Vous êtes dans la salle sous le nom «\u00a0%{name}\u00a0»."
          forgotten: "Ce navigateur a oublié son inscription à ce webinaire. Inscrivez-vous, ou ouvrez le lien de votre propre inscription."
        pending:
          title: "Vérifiez votre boîte mail"
          trial_title: "Inscription en mode essai"
          trial: "Cette inscription est un essai. Aucun email n'est envoyé."
          sent: "Si votre inscription nécessite une confirmation, un message vous permettra de confirmer votre adresse."
          back: "Revenir au webinaire"
      registration_requests:
        show:
          title: "Confirmer votre inscription"
          covers: "Cette demande porte sur :"
          notify_next: "Vous avez demandé à être prévenu·e du prochain webinaire."
          intro: "Si c'est bien vous, cliquez sur le bouton ci-dessous. Rien n'est confirmé tant que vous n'avez pas cliqué ; sans confirmation, la demande est effacée sous 30 jours."
          marketing_consent_notice: "La case « Ok pour %{que_organization} me recontacte au sujet de ses activités. Je peux dire stop quand je veux. » a été cochée lors de cette demande. Choisissez ci-dessous si vous acceptez %{que_organization} vous recontacte ; vous pourrez dire stop à tout moment."
          button: "Confirmer mon inscription"
          button_with_marketing: "Confirmer et accepter d'être recontacté·e"
          button_without_marketing: "Confirmer sans être recontacté·e"
          not_you_html: "Si vous n'êtes pas à l'origine de cette demande, fermez simplement cette page. Voir la %{privacy}."
        confirmed:
          title: "Inscription confirmée"
          heading: "C'est confirmé, merci !"
          keep_mail: "Gardez le mail reçu : son lien ramène à cette page, d'où vous rejoindrez le direct le jour venu."
          open: "Ouvrir la page du webinaire"
          notify_next: "C'est noté : nous vous préviendrons par email de la date du prochain webinaire."
          marketing_consent_given_html: "C'est noté aussi : %{organization} pourra vous recontacter au sujet de ses activités. Pour dire stop : %{withdraw}, ou écrivez à %{contact}."
          withdraw_link: "ne plus être recontacté·e"
          privacy_html: "Voir la %{privacy}."
      marketing_consents:
        show:
          title: "Confirmer le consentement"
          heading: "Confirmer votre consentement"
          context_html: "Lors de votre inscription à <strong>%{title}</strong>, la case <em>« J'accepte %{que_organization} me recontacte au sujet de ses activités »</em> a été cochée."
          intent: "Si c'est bien votre intention, cliquez sur le bouton ci-dessous. Rien n'est enregistré tant que vous n'avez pas cliqué."
          accept: "Oui, j'accepte d'être recontacté·e"
          not_you: "Si vous n'avez pas coché cette case ou si quelqu'un d'autre vous a inscrit·e, vous pouvez fermer cette page — aucun consentement ne sera enregistré. Vous pouvez aussi marquer explicitement votre refus :"
          decline: "Non merci"
          withdraw_html: "Vous pouvez à tout moment retirer un consentement déjà donné, ou écrire à %{contact}."
        created:
          title: "Consentement enregistré"
          heading: "Merci — votre consentement est enregistré"
          mail: "Vous recevrez un email de confirmation contenant un lien de retrait, utilisable à tout moment."
          contact_html: "Vous pouvez aussi écrire à %{contact} pour retirer votre consentement, et consulter la %{privacy}."
        declined:
          title: "Refus pris en compte"
          heading: "C'est noté — pas de recontact"
          body: "Vous ne serez pas recontacté·e. Le lien que vous venez d'utiliser a été invalidé."
          registration_html: "Votre inscription au webinaire <strong>%{title}</strong> n'est pas affectée."
        expired:
          title: "Lien expiré"
          heading: "Ce lien a expiré"
          body: "Le lien de confirmation de consentement est valide 14 jours après l'inscription. Celui que vous venez d'utiliser a expiré."
          contact_html: "Si vous souhaitez tout de même être recontacté·e, écrivez à %{contact}."
        already_consented:
          title: "Déjà consenti"
          heading: "Consentement déjà enregistré"
          body_html: "Vous avez déjà confirmé votre consentement. Pour le retirer, utilisez le lien de retrait reçu par email ou écrivez à %{contact}."
        already_withdrawn:
          title: "Consentement retiré"
          heading: "Vous avez déjà retiré votre consentement"
          body: "Vous ne serez pas recontacté·e. L'ancien lien de confirmation que vous venez d'utiliser est désactivé."
      marketing_withdrawals:
        show:
          title: "Retirer mon consentement"
          heading: "Retirer votre consentement au recontact"
          context_html: "Vous avez précédemment accepté %{que_organization} vous recontacte au sujet de ses activités, dans le cadre de votre inscription à <strong>%{title}</strong>. Vous pouvez retirer ce consentement maintenant."
          button: "Oui, retirer mon consentement"
          cancel: "Si vous changez d'avis, fermez simplement cette page — rien ne sera enregistré tant que vous n'avez pas cliqué."
        created:
          title: "Retrait pris en compte"
          heading: "Votre retrait est enregistré"
          body_html: "Vous ne serez plus recontacté·e au sujet des activités %{de_organization}. Le retrait est noté dans notre CRM, où votre fiche reste ; votre inscription au webinaire n'est pas affectée. Pour en demander la suppression, écrivez à %{contact} (cf. %{privacy})."
        already_withdrawn:
          title: "Déjà retiré"
          heading: "Consentement déjà retiré"
          body: "Ce lien a déjà été utilisé, ou votre consentement a déjà été retiré par un autre canal. Vous ne serez pas recontacté·e."
      webinars:
        pre_live:
          starts_in: "Commence dans"
          ended: "Ce direct est terminé."
          live_registration_required: "Le direct a commencé. Inscrivez-vous pour entrer tout de suite ; déjà inscrit·e, le lien de votre mail vous fait entrer."
        registration_cta:
          registered: "Vous êtes inscrit·e, %{name}."
          heading: "S'inscrire au webinaire"
          intro: ""
          name: "Nom"
          email: "Adresse email"
          participation: "Comment souhaitez-vous participer ?"
          spectator: "J'observe — j'ai le chat"
          participant: "Je participe — caméra et micro"
          privacy_notice_html: "Votre nom et votre email servent à votre inscription et aux messages relatifs à ce webinaire. %{privacy}"
          submit: "M'inscrire"
          closed: "Les inscriptions ne sont pas encore ouvertes."
        # Entrée dans la salle d'un inscrit qui n'a jamais choisi
        # (webinars/room.html.erb, ParticipationsController). Choix produit :
        # deux options simples, jamais « main levée » ni admission
        # par l'animation, aucun sous-texte sur l'attente.
        participation_choice:
          legend: "Comment souhaitez-vous participer ?"
          spectator: "J'observe — j'ai le chat"
          participant: "Je participe — caméra et micro"
          # Dans la salle, tant que l'animation n'a pas ouvert la caméra et
          # le micro (hand_raise_viewer.jsx) : rassurant, sans attente nommée.
          waiting: "On vous ouvre la caméra et le micro dans un instant."
          observe_instead: "Je préfère observer"
          submit: "Entrer dans la salle"
          error: "Votre choix n'a pas été enregistré. Réessayez, ou rechargez la page."
          recording_notice: "Si la parole vous est donnée, votre image et votre voix sont enregistrées et votre voix est transcrite"
      # Lien participants privé (/i, InvitationEntry) : nom, email et choix
      # repris du formulaire d'inscription (webinars.registration_cta).
      invitations:
        show:
          title: "Rejoindre le direct"
          intro_html: "Vous êtes invité·e à <strong>%{title}</strong>."
          participant: "Je participe — caméra et micro, tout de suite"
          submit: "Rejoindre"
          keep_link: "Un mail vous demandera de confirmer votre adresse. Participant·e, vous recevez un lien personnel : gardez-le ; rouvrir cette page depuis le même navigateur vous y ramène."
      # Rattachement d'une intervention à une inscription (/rattacher?t=).
      speaker_links:
        show:
          title: "Confirmer votre intervention"
          intro: "Si vous êtes bien intervenu·e à ce webinaire sous le nom indiqué dans le mail, cliquez sur le bouton : vos interventions seront rattachées à votre inscription. Rien n'est rattaché tant que vous n'avez pas cliqué."
          button: "Oui, c'était moi"
          not_you: "Ce n'était pas vous ? Fermez simplement cette page."
        linked:
          title: "C'est noté"
          body: "Votre intervention est rattachée à votre inscription."
        invalid:
          title: "Lien expiré"
          body: "Ce lien a déjà servi ou ne sert plus."
      # Mail aux co-organisateurs (CoOrganizerMailer) : le corps est commun,
      # seuls l'objet et ces libellés suivent la tonalité de la demande.
      co_organizer_mailer:
        message_received:
          subject: "Message d'une inscription confirmée"
          webinars: "Webinaire(s) :"
          notify_next: "Prévenir du prochain webinaire"

